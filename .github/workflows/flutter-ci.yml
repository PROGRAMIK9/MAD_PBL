name: Flutter CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release
        - name: Build Android release (placeholder)
          if: runner.os == 'Windows' || runner.os == 'Linux'
          run: |
            echo "Preparing Android release build (placeholder). Configure Android SDK and signing in CI before enabling."
            # To enable Android release builds, set up ANDROID_SDK_ROOT and signing env vars, then run:
            # ./gradlew assembleRelease -p android

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: offline-mesh-app-windows
          path: build/windows/x64/runner/Release
